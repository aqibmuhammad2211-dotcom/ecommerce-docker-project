apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: directus-uploads-pvc
  namespace: ecommerce
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: directus
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: directus
  template:
    metadata:
      labels:
        app: directus
    spec:
      containers:
        - name: directus
          image: directus/directus:latest
          ports:
            - containerPort: 8055
          env:
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: DIRECTUS_SECRET
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: DIRECTUS_ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: DIRECTUS_ADMIN_PASSWORD
            - name: DB_CLIENT
              value: pg
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - mountPath: /directus/uploads
              name: directus-uploads
          readinessProbe:
            httpGet:
              path: /server/health
              port: 8055
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 10
      volumes:
        - name: directus-uploads
          persistentVolumeClaim:
            claimName: directus-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: directus
  namespace: ecommerce
spec:
  selector:
    app: directus
  ports:
    - port: 8055
      targetPort: 8055
